api_platform:
    # 1. MÉTADONNÉES DE L'API
    title: Hello API Platform
    version: 1.0.0

    # 2. CONFIGURATION SWAGGER / OPENAPI
    swagger:
        api_keys:
            jwt:
                name: Authorization
                type: header

    # 3. CONFIGURATION PAR DÉFAUT (Appliquée à toutes les entités)
    defaults:
        stateless: true

        # 🚀 CACHE HTTP : Réduit drastiquement la charge serveur
        cache_headers:
            max_age: 60 # Le navigateur garde les données 1 min
            shared_max_age: 3600 # Les serveurs intermédiaires gardent 1h
            vary: ["Content-Type", "Authorization", "Origin"]

    # 🏎️ EAGER LOADING : Évite le problème des requêtes SQL N+1
    # Doit être aligné avec "defaults" et "swagger", pas dedans !
    eager_loading:
        enabled: true
        force_eager: false
        max_joins: 100

    # 4. GESTION DE L'INVALIDATION DU CACHE
    http_cache:
        invalidation:
            enabled: true

    # 5. FORMATS DE DONNÉES SUPPORTÉS
    formats:
        jsonld: ["application/ld+json"]
        json: ["application/json"]
        html: ["text/html"]

    # 6. INTERFACES DE DOCUMENTATION
    enable_swagger: true
    enable_swagger_ui: true
    enable_re_doc: false

    openapi:
        swagger_ui_extra_configuration:
            persistAuthorization: true
